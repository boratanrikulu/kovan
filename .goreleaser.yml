# Release config for goreleaser v2. Tag v* → GitHub release with tarballs,
# Linux packages and checksums, plus a Homebrew cask pushed to
# boratanrikulu/homebrew-tap for mac. No Windows: kovan needs tmux.
version: 2

project_name: kovan

builds:
  - id: kovan
    main: ./cmd/kovan
    binary: kovan
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: kovan
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

# Homebrew casks are macOS-only, so Linux gets distro packages instead. The
# claude CLI is not in any distro's repos, so it stays a documented
# prerequisite rather than a dependency that would make the package
# uninstallable.
nfpms:
  - id: kovan
    package_name: kovan
    formats: [deb, rpm, apk]
    maintainer: "Bora Tanrikulu <me@bora.sh>"
    description: "Teach your engineering methodology once; every AI agent inherits it"
    homepage: "https://github.com/boratanrikulu/kovan"
    license: MIT
    bindir: /usr/bin
    dependencies:
      - git
      - tmux

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: kovan
    repository:
      owner: boratanrikulu
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/boratanrikulu/kovan"
    description: "Teach your engineering methodology once; every AI agent inherits it"
    dependencies:
      - formula: git
      - formula: tmux
    caveats: "kovan drives Claude Code today (more agents later) — install the claude CLI separately: https://claude.com/claude-code"
    commit_author:
      name: goreleaser
      email: noreply@github.com
    # The binary is unsigned; clear the gatekeeper quarantine flag on install so
    # `kovan` runs without a "developer cannot be verified" block.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/kovan"]
          end

release:
  github:
    owner: boratanrikulu
    name: kovan
